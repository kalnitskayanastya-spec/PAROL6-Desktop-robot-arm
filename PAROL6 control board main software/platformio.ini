[env:octopus_parol6_main_safe_0000]
platform = ststm32
board = nucleo_f446ze
framework = arduino
upload_protocol = dfu
board_build.f_cpu = 168000000L
board_build.offset = 0
upload_flags = --dfuse-address 0x08000000

build_flags =
   -D PAROL6_BOARD_OCTOPUS_PRO_F446
   -D OCTOPUS_BOARD
   -D PAROL6_OCTOPUS_SAFE_MAIN
   -D PAROL6_SAFE_NO_MOTION
   -D PAROL6_DISABLE_HOMING
   -D PAROL6_CAN_TIMEOUT_MS=250
   -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
   -D USBCON
   -D USBD_VID=0x0483
   -D USBD_PID=0x5740
   -D USB_MANUFACTURER="Unknown"

build_src_filter =
   +<*>
   -<octopus_motor_slot_test.cpp>
   -<octopus_limit_opto_diag.cpp>
   -<octopus_one_motor_test.cpp>
   -<octopus_tmc_all_slots_diag.cpp>
   -<octopus_tmc_diag.cpp>
   -<octopus_usb_test.cpp>
   -<octopus_usb_cdc_baseline.cpp>
   -<octopus_limit_opto_baseline.cpp>
   -<octopus_limit_opto_diag_v2.cpp>
   +<octopus_clock.cpp>

monitor_speed = 3000000

