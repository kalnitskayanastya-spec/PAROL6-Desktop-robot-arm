
[env:octopus_pro_f446]
platform = ststm32
board = nucleo_f446ze
framework = arduino
board_build.mcu = stm32f446ze
board_build.f_cpu = 180000000L
board_build.offset = 32K
build_flags =
    -DSERIAL_UART_INSTANCE=2
    -DPIN_SERIAL_RX=PD6
    -DPIN_SERIAL_TX=PD5
    -DHSE_VALUE=12000000L
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DOCTOPUS_BOARD
    -DUSBCON
    -DUSBD_USE_CDC
    -DHAL_PCD_MODULE_ENABLED
monitor_dtr = 1
upload_protocol = dfu
upload_flags = --dfuse-address 0x08008000
debug_tool = stlink
monitor_speed = 3000000
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    waspinator/AccelStepper @ ^1.64

[env:octopus_usb_test_0000]
platform = ststm32
board = nucleo_f446ze
framework = arduino
upload_protocol = dfu
board_build.f_cpu = 168000000L
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED
    -D HSE_VALUE=12000000U
build_src_filter = +<octopus_usb_test.cpp>

